<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Pratyush Panda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: var(--bg-paper);
            background-image: radial-gradient(circle, var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 32px 32px;
        }
        .error-card {
            max-width: 500px;
            width: 100%;
            background: #fff;
            border: var(--border);
            border-radius: var(--wobbly-radius);
            box-shadow: var(--hard-shadow);
            padding: 50px 40px;
            text-align: center;
        }
        .error-code {
            font-family: 'Kalam', cursive;
            font-size: 6rem;
            color: var(--accent-red);
            line-height: 1;
            margin-bottom: 10px;
            display: inline-block;
            transform: rotate(-3deg);
        }
        .error-title {
            font-family: 'Kalam', cursive;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .error-text {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border: var(--border);
            border-radius: var(--wobbly-radius);
            background: var(--ink);
            color: #fff;
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            box-shadow: var(--hard-shadow);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .home-btn:hover {
            box-shadow: var(--hard-shadow-hover);
            transform: translate(3px, 3px);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <span class="error-code">404</span>
            <h1 class="error-title">Whoops! Page Lost... 🗺️</h1>
            <p class="error-text">It looks like the page you are searching for has scribbled off the canvas. Let's get you back on track!</p>
            <a href="/" class="home-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
</body>
</html>
